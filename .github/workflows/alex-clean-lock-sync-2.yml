name: Alex Clean Lock Sync 2

on:
  push:
    branches:
      - designlab/tournament-b-alex-schleifer
    paths:
      - .github/workflows/alex-clean-lock-sync-2.yml

permissions:
  contents: write

jobs:
  clean-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Alex candidate
        uses: actions/checkout@v4
        with:
          ref: designlab/tournament-b-alex-schleifer
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild dependency lock cleanly
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Commit clean lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m '[clean-lock-sync] Rebuild npm lockfile with SDK-compatible dependencies'
          git push origin HEAD:designlab/tournament-b-alex-schleifer
