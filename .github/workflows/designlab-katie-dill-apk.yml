name: DesignLab Katie Dill APK

on:
  push:
    branches:
      - "designlab/tournament-b-katie-dill"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: designlab-katie-dill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    name: Verify whole app and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out frozen candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm frozen Xplorer ancestor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 78632b12eeb4e4123b1a767c8b815fe6617681f9 HEAD
          echo "Candidate descends from frozen Tournament B Xplorer baseline."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install exact dependencies
        run: npm ci

      - name: Apply Katie Dill whole-app redesign
        shell: bash
        run: |
          set -euo pipefail
          node scripts/designlab-katie-dill.cjs
          node <<'NODE'
          const fs=require('fs');
          const p='components/TabBar.js';
          const source=fs.readFileSync(p,'utf8');
          const before='borderTopWidth:1,\n    borderTopColor:INK.hair';
          const after='borderTopWidth:2,\n    borderTopColor:INK.hair';
          if(!source.includes(before)) throw new Error('Expected Katie footer boundary not found');
          fs.writeFileSync(p,source.replace(before,after),'utf8');
          NODE

      - name: Prove redesign stayed out of protected product surfaces
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo "Changed files:"
          git diff --name-only HEAD
          if git diff --name-only HEAD | grep -E '^(services/|supabase/|context/|hooks/useLivingMap|utils/(permissions|audience|markers|routing|mapLayers|navigation|drawer)\.js|app/.*(create|edit|review|dashboard|login|signup))' ; then
            echo "::error::Katie candidate touched a protected product/permission/backend surface."
            exit 1
          fi

      - name: Mount and test every route
        run: npm run test:ci

      - name: Verify source invariants outside package scripts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-no-unguarded-seed.cjs
          node scripts/verify-linkup-create-navigation.cjs
          node scripts/verify-linkup-title-only.cjs

      - name: Run every deterministic Xplorer verifier except browser
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            verify:social verify:live verify:screens verify:taxonomy verify:markers \
            verify:place verify:cards verify:discover verify:reputation verify:places \
            verify:memories verify:mymap verify:livingmap verify:trending verify:score \
            verify:manager verify:listings verify:permissions verify:friends verify:contrast \
            verify:nativemap verify:audience verify:camera verify:audit
          do
            echo "---- npm run $script"
            npm run "$script"
          done

      - name: Check Expo project against frozen Tournament B dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx expo-doctor 2>&1 | tee expo-doctor-katie.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # The frozen 2026-08-14 Xplorer baseline predates the current SDK 57
          # patch recommendations by one patch on seven Expo packages. Tournament
          # B requires every challenger to use that exact dependency basis, so
          # this single doctor condition is advisory. Any second failure, any
          # minor/major mismatch, or any different package-health problem still
          # blocks the APK.
          grep -q "20/21 checks passed" expo-doctor-katie.log
          grep -q "Patch version mismatches" expo-doctor-katie.log
          grep -q "7 packages out of date" expo-doctor-katie.log
          ! grep -q "Major version mismatches" expo-doctor-katie.log
          ! grep -q "Minor version mismatches" expo-doctor-katie.log
          for expected in \
            "expo                ~57.0.13  57.0.12" \
            "expo-constants      ~57.0.11  57.0.10" \
            "expo-image-picker   ~57.0.10  57.0.9" \
            "expo-linking        ~57.0.6   57.0.5" \
            "expo-location       ~57.0.10  57.0.9" \
            "expo-notifications  ~57.0.11  57.0.10" \
            "expo-router         ~57.0.13  57.0.12"
          do
            grep -Fq "$expected" expo-doctor-katie.log
          done
          echo "::warning::Expo Doctor reports only the exact patch-level drift inherited from the frozen Tournament B baseline; dependencies remain frozen intentionally."

      - name: Build web bundle for route verification
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-katie-ci

      - name: Verify all routes in a real browser
        env:
          DIST_DIR: dist-katie-ci
          REQUIRE_BROWSER: "1"
        run: npm run verify:browser

      - name: Commit the tested Katie source to its isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DesignLab CI"
          git config user.email "ci@designlab.local"
          git add components/Header.js components/MapControls.js components/DiscoverCard.js components/QuickAccessDrawer.js components/StartupSplash.js components/TabBar.js hooks/useColors.js designlab/katie-dill/DESIGN_CONSTITUTION.md
          if git diff --cached --quiet; then
            echo "Katie source already committed."
          else
            git commit -m "Apply Katie Dill whole-app challenger design"
            git push origin HEAD:designlab/tournament-b-katie-dill
          fi

      - name: Generate Android project
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Xplorer-Katie-Dill.apk

      - name: Upload Katie Dill APK
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-Katie-Dill-APK
          path: Xplorer-Katie-Dill.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Katie design constitution
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-Katie-Dill-design-record
          path: designlab/katie-dill/DESIGN_CONSTITUTION.md
          if-no-files-found: error
          retention-days: 30
