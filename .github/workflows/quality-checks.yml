name: Guestbook Quality Checks

on:
  pull_request:
    branches: [main, main2.0, "main2.0-**"]
  push:
    branches: [main, main2.0, "main2.0-**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guestbook-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Expo web build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require clean dependency audit
        run: npm audit --audit-level=moderate

      # Packet 0. This is the only step in this file that proves a screen
      # renders; every step below it reads source text or builds a bundle.
      - name: Mount every route
        run: npm run test:ci

      - name: Refuse a migration that seeds test data unguarded
        run: node scripts/verify-no-unguarded-seed.cjs

      - name: Verify the business taxonomy has exactly one source
        run: node scripts/verify-taxonomy.cjs

      - name: Refuse a manually set map marker and an untokenised colour
        run: node scripts/verify-marker-assignment.cjs

      - name: Verify the place pages share one layout
        run: node scripts/verify-place-layout.cjs

      - name: Verify the map keeps its position and the card needs no map
        run: node scripts/verify-map-cards.cjs

      - name: Verify no recommendation appears without a reason
        run: node scripts/verify-discover.cjs

      - name: Verify review reputation and endorsement wording
        run: node scripts/verify-review-reputation.cjs

      - name: Verify canonical places, follows and Moment visibility
        run: npm run verify:places

      - name: Verify the Memory lifecycle and its archive defaults
        run: npm run verify:memories

      - name: Verify My Map stays the owner's alone
        run: npm run verify:mymap

      - name: Verify the living map reaches both surfaces
        run: npm run verify:livingmap

      - name: Verify the trending formula and source reasons
        run: npm run verify:trending

      - name: Verify the scoring engine cannot be written by a client
        run: npm run verify:score

      - name: Verify QR codes stay off public pages and manager tools stay reachable
        run: npm run verify:manager

      - name: Verify Explorer social layer
        run: npm run verify:social

      - name: Verify Link-ups and Live Discovery
        run: npm run verify:live

      - name: Verify Link-up create navigation
        run: node scripts/verify-linkup-create-navigation.cjs

      - name: Verify title-only Link-up creation
        run: node scripts/verify-linkup-title-only.cjs

      - name: Verify screen gates and route declarations
        run: node scripts/verify-screen-gates.cjs

      - name: Check Expo project
        run: npx expo-doctor

      - name: Build Expo web app
        env:
          CI: true
        run: npx expo export --platform web --output-dir dist-ci

      - name: Verify create route in web bundle
        run: grep -R --fixed-strings "/linkups/create" dist-ci >/dev/null

      # The half of the harness that was missing for twelve packets: load every
      # route in a real browser and fail on an uncaught render error. Jest
      # cannot cover this -- test/setup.js mocks react-native-maps, and that
      # mock is exactly what made a native-only import look healthy while every
      # profile rendered a black screen.
      #
      # REQUIRE_BROWSER=1 makes this binding: GitHub's ubuntu runners ship
      # Chrome, and a gate that can silently skip is the exact weakness this one
      # exists to remove. If a runner ever lacks a browser this step fails
      # loudly, which is the right way to find that out.
      - name: Verify every route renders in a browser
        env:
          DIST_DIR: dist-ci
          REQUIRE_BROWSER: "1"
        run: npm run verify:browser

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: guestbook-web-preview
          path: dist-ci
          retention-days: 7
