name: Alex Expo Lock Sync

on:
  push:
    branches:
      - designlab/tournament-b-alex-schleifer
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, '[expo-lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Alex candidate
        uses: actions/checkout@v4
        with:
          ref: designlab/tournament-b-alex-schleifer
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile from declared SDK versions
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
          else
            git commit -m '[expo-lock-sync] Sync Expo SDK 57 patch lockfile'
            git push origin HEAD:designlab/tournament-b-alex-schleifer
          fi
