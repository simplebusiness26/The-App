name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/map-crash-apk-b1b3bw

permissions:
  contents: read

concurrency:
  group: guestbook-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://yzpthslwsvesgndzdqai.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vHyb7Rbz7aCh3WyyWZG7HQ_LQoK8wy5
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK download
        shell: bash
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/Guestbook.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guestbook-Android-APK
          path: apk-output/Guestbook.apk
          if-no-files-found: error
          retention-days: 30
