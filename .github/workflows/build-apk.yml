name: Build Android APK
run-name: APK • ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main2.0-Dev
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: guestbook-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      EXPO_PUBLIC_SUPABASE_URL: https://yzpthslwsvesgndzdqai.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vHyb7Rbz7aCh3WyyWZG7HQ_LQoK8wy5
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      # The demo logins -- five taps on the word Login opens them.
      #
      # THIS IS WHY THE PANEL SAID "off in this build". The variables were only
      # ever read from a local .env, and this workflow is where the APK is
      # actually made, so the phone build never saw them. Setting them locally
      # could not have worked.
      #
      # Secrets rather than literals: EXPO_PUBLIC_ values are baked into the APK
      # and anybody holding it can read them, so this password is only ever as
      # private as the builds are. Keeping it out of the repository at least
      # means the source is not a second copy of it.
      #
      # Add both at Settings > Secrets and variables > Actions. Left unset, the
      # panel reports itself off -- which is the right behaviour for any build
      # going to somebody other than the owner.
      EXPO_PUBLIC_DEMO_PASSWORD: ${{ secrets.EXPO_PUBLIC_DEMO_PASSWORD }}
      EXPO_PUBLIC_DEMO_ADMIN_EMAIL: ${{ secrets.EXPO_PUBLIC_DEMO_ADMIN_EMAIL }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npx expo config --type public > /tmp/expo-config.json

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK download
        shell: bash
        run: |
          mkdir -p apk-output
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No release APK was produced."
            exit 1
          fi
          cp "$APK_PATH" apk-output/Guestbook.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Guestbook-Android-APK
          path: apk-output/Guestbook.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Add download instructions
        shell: bash
        run: |
          echo "### Guestbook APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "Open this workflow run's **Artifacts** section and download **Guestbook-Android-APK**." >> "$GITHUB_STEP_SUMMARY"
          echo "Unzip it on Android, then open **Guestbook.apk** to install." >> "$GITHUB_STEP_SUMMARY"
