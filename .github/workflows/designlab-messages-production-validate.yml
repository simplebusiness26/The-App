name: DesignLab Messages Downstream Validation

on:
  push:
    branches:
      - designlab/messages-living-inbox
    paths:
      - '.github/workflows/designlab-messages-production-validate.yml'

permissions:
  contents: read

jobs:
  downstream:
    name: Web build and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Expo web app
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist-ci

      - name: Verify create route in web bundle
        run: grep -R --fixed-strings "/linkups/create" dist-ci >/dev/null

      - name: Verify every route renders in a browser
        env:
          DIST_DIR: dist-ci
          REQUIRE_BROWSER: "1"
        run: npm run verify:browser

      - name: Require reviewed dependency audit
        run: npm run verify:audit

      - name: Upload validation build
        uses: actions/upload-artifact@v4
        with:
          name: designlab-messages-web-preview
          path: dist-ci
          retention-days: 7
